server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(health|productos|pedidos|reportes|__test__)(/|$) {
        proxy_pass http://backend:3000;
        client_max_body_size 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
