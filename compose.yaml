services:
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
